<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои заметки — 20 вкусных рецептов</title>
  <style>
    :root{--ink:#273326;--muted:#6d7869;--paper:#fffdf8;--line:#e6e6d9;--green:#315e45;--lime:#edf3e7}
    *{box-sizing:border-box}
    body{margin:0;background:#eeeee6;color:var(--ink);font:16px/1.62 system-ui,-apple-system,'Segoe UI',sans-serif}
    .page{max-width:930px;margin:35px auto;background:var(--paper);box-shadow:0 18px 60px #242d231c;border-radius:18px;overflow:hidden}
    .hero{background:linear-gradient(123deg,#183a2a,#3e684b);color:#fff;padding:45px 60px 38px}
    .eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#d6e6c8;font-weight:800}
    h1{font:700 clamp(32px,5vw,51px)/1.12 Georgia,serif;letter-spacing:-.8px;margin:14px 0 12px}
    .hero p{color:#e4eddf;font-size:17px;margin:0}
    .content{padding:35px 60px 54px}
    .actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:25px}
    a{color:var(--green)}
    .navlink{font-weight:700;text-decoration:none}
    .btn{background:var(--green);color:white;border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer}
    .btn:disabled{opacity:.55;cursor:wait}
    #all-notes-status{color:var(--muted);font-size:14px;min-height:22px;margin:0 0 15px}
    #all-notes{list-style:none;margin:0;padding:0}
    .gn-note-card{border:1px solid var(--line);background:#fff;border-radius:12px;margin:12px 0;padding:18px 21px}
    .gn-note-card a{font:700 22px/1.3 Georgia,serif;text-decoration:none}
    .gn-note-card a:hover{text-decoration:underline}
    .gn-note-card p{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 0}
    .hint{font-size:13px;color:var(--muted)}
    @media(max-width:650px){.page{margin:0;border-radius:0}.hero{padding:35px 25px}.content{padding:25px}.gn-note-card{padding:16px}.gn-note-card a{font-size:20px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="eyebrow">Персональная коллекция · заметки после готовки</div>
      <h1>📝 Все мои заметки</h1>
      <p>Единый список заметок к рецептам — только те, где есть записи.</p>
    </header>
    <div class="content">
      <div class="actions">
        <a class="navlink" href="index.html">← Ко всем 20 рецептам</a>
        <button type="button" class="btn" id="refresh-notes">Обновить список</button>
      </div>
      <div id="all-notes-status" role="status">Загрузка…</div>
      <ol id="all-notes"></ol>
      <div id="notes-settings"></div>
      <p class="hint">Тексты загружаются напрямую из папки notes в GitHub. Для просмотра токен не нужен. Название блюда открывает его рецепт.</p>
    </div>
  </main>
  <script src="github-notes.js"></script>
</body>
</html>
